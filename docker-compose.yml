  pharmacy-service-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmacy-service-1
    ports:
      - "8181:8181"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      pharmacy-db:
        condition: service_healthy
      auth-service-1:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8181/pharmacy-service/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  pharmacy-service-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmacy-service-2
    ports:
      - "8182:8181"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      pharmacy-db:
        condition: service_healthy
      auth-service-1:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8182/pharmacy-service/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pharmacy-db-data:
  auth-db-data: