server:
  port: 8181
  servlet:
    context-path: /pharmacy-service

spring:
  profiles:
    active: dev
  application:
    name: pharmacy-service-impl
  datasource:
    url: jdbc:postgresql://localhost:5433/pharmacy_db
    username: postgres
    password: postgres
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 60000
            read-timeout: 10000
          auth-service:
            url: http://localhost:8282
            connect-timeout: 60000
            read-timeout: 10000
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100, expireAfterAccess=10s


auth:
  service:
    url: http://localhost:8282/auth-service

logging:
  level:
    org:
      hibernate:
        sql: DEBUG
    org.pharmacy.exception.handler: ERROR
    org.springframework.cache: TRACE
  file:
    name: logs/pharmacy-app.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %level - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

pharmacy-service:
  pharmacy-info:
    url: http://localhost:8282/auth-service/api/v1/info/
  user-info:
    url: http://localhost:8383/external/api/user/info/

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html