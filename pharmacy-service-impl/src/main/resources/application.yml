spring:
  application:
    name: pharmacy-service-impl
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: root
  liquibase:
    change-log: db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  cache:
    type: caffeine
    cache-names: userToken
    caffeine:
      spec: expireAfterAccess=300s, initialCapacity=100, maximumSize=10
  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
      client:
        config:
          default:
            connectTimeout: 60000
            readTimeout: 10000
          auth-service:
            url: http://localhost:8081
            connectTimeout: 60000
            readTimeout: 10000

logging:
  level:
    org:
      hibernate:
        sql: debug